[project]
name = "ha-classcharts"
version = "1.2.0"
description = "Unofficial ClassCharts (Parent) integration for Home Assistant"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # HA 2026.7+ requires Python >=3.14.2; CI runs on that combination.
    # Locally this floor resolves to the newest homeassistant release
    # compatible with whatever Python is available.
    "homeassistant>=2026.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["custom_components"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
